<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход — ГабионОпт</title>
<style>
  :root { --ink: #1c1a17; --muted: #6b6560; --line: #e4dfd8; --surface: #fff; --surface-2: #f5f2ee; --accent: #b5621a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Golos Text", -apple-system, sans-serif; background: var(--surface-2); color: var(--ink); }
  .card { background: var(--surface); border-radius: 14px; padding: 32px 28px; width: 100%; max-width: 340px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 18px; margin: 0 0 20px; }
  label { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-bottom: 4px; }
  input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; margin-bottom: 14px; }
  button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: #a83028; font-size: 13px; margin: -6px 0 14px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Вход в админку ГабионОпт</h1>
  <form id="loginForm">
    <label>Логин</label>
    <input type="text" name="username" autocomplete="username" required autofocus>
    <label>Пароль</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <div class="err" id="err">Неверный логин или пароль</div>
    <button type="submit" id="submitBtn">Войти</button>
  </form>
</div>
<script>
(function () {
  var form = document.getElementById("loginForm");
  var err = document.getElementById("err");
  var btn = document.getElementById("submitBtn");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Входим…";
    fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: form.username.value, password: form.password.value })
    }).then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (res.ok && res.data.ok) {
          var next = new URLSearchParams(location.search).get("next");
          location.href = next || "/admin/";
        } else {
          err.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Войти";
        }
      })
      .catch(function () {
        err.textContent = "Ошибка соединения. Попробуйте ещё раз.";
        err.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Войти";
      });
  });
})();
</script>
</body>
</html>
